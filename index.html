<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NextUp</title>
    <style>
      :root {
        --bg: #303e34;
        --panel: #39483d;
        --panel-alt: #49584a;
        --task-hover: #546556;
        --border: #5a695a;
        --text: #edf2ec;
        --muted: #bbc7ba;
        --dim: #a0aea0;
        --amber: #a1c9a2;
        --amber-ink: #26372a;
        --green: #91bd98;
        --success: #7ecb91;
        --danger: #ee8b82;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, sans-serif;
      }
      body { padding: 1rem; }
      button, input, select { font: inherit; }
      button { cursor: pointer; }
      #app { width: min(100%, 900px); margin: 0 auto; }

      .nu-app {
        width: min(100%, 900px);
        margin: 0 auto;
        padding: 1.5rem;
        border-radius: 8px;
        background: var(--bg);
        color: var(--text);
      }

      .nu-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 1rem;
        flex-wrap: wrap;
        margin-bottom: 1.25rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--border);
      }

      .nu-title {
        margin: 0;
        font-size: 2.6rem;
        line-height: 1;
        font-weight: 800;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }
      .nu-title span { color: var(--amber); }

      .nu-subtitle {
        margin: 0.25rem 0 0;
        color: var(--muted);
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .nu-stats {
        display: flex;
        gap: 1.5rem;
      }

      .nu-stat {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 56px;
      }

      .nu-stat-num {
        font-family: "IBM Plex Mono", monospace;
        font-size: 1.5rem;
        font-weight: 700;
      }
      .nu-stat-danger .nu-stat-num { color: var(--danger); }
      .nu-stat-label {
        margin-top: 0.1rem;
        color: var(--dim);
        font-size: 0.6rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .nu-panel, .nu-household-panel {
        margin-bottom: 1rem;
        padding: 1.1rem;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--panel);
      }

      .nu-household-panel {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .nu-household-title {
        font-size: 0.88rem;
        font-weight: 600;
      }

      .nu-household-sub {
        margin-top: 0.15rem;
        max-width: 480px;
        color: var(--muted);
        font-size: 0.76rem;
      }

      .nu-household-controls {
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }

      .nu-switch {
        position: relative;
        width: 40px;
        height: 22px;
        border: 1px solid var(--border);
        border-radius: 11px;
        background: var(--panel-alt);
        padding: 0;
      }
      .nu-switch.on {
        border-color: var(--green);
        background: var(--green);
      }
      .nu-switch-knob {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        transition: left 0.15s ease-out;
      }
      .nu-switch.on .nu-switch-knob { left: 20px; }

      .nu-field-row {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 0.75rem;
      }

      .nu-field {
        display: flex;
        flex: 1 1 150px;
        flex-direction: column;
        gap: 0.3rem;
        min-width: 120px;
      }
      .nu-field-name { flex: 2 1 200px; }

      .nu-label, .nu-sort-label {
        color: var(--muted);
        font-size: 0.62rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .nu-input {
        width: 100%;
        padding: 0.55rem 0.65rem;
        border: 1px solid var(--border);
        border-radius: 3px;
        background: #2b382f;
        color: var(--text);
        font-size: 0.9rem;
      }
      .nu-input-sm { padding: 0.4rem 0.55rem; font-size: 0.82rem; }
      .nu-input::placeholder { color: var(--dim); }

      .nu-btn {
        padding: 0.6rem 1rem;
        border: 0;
        border-radius: 3px;
        font-weight: 600;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }
      .nu-btn-primary {
        background: var(--amber);
        color: var(--amber-ink);
      }

      .nu-sort-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-bottom: 0.75rem;
      }

      .nu-sort-toggle {
        display: flex;
        overflow: auto hidden;
        border: 1px solid var(--border);
        border-radius: 3px;
        background: var(--panel-alt);
      }

      .nu-sort-btn, .nu-group-toggle {
        padding: 0.45rem 0.75rem;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 0.76rem;
        font-weight: 600;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .nu-sort-btn.active {
        background: var(--amber);
        color: var(--amber-ink);
      }

      .nu-group-toggle {
        border: 1px solid var(--border);
        border-radius: 3px;
      }
      .nu-group-toggle.active {
        border-color: var(--green);
        background: var(--green);
        color: #17351f;
      }

      .nu-task-row {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) auto auto auto;
        align-items: center;
        gap: 0.9rem;
        padding: 0.85rem 0.75rem;
        border-bottom: 1px solid var(--border);
        background: var(--panel-alt);
        transition: background-color 0.15s ease-out;
      }
      .nu-task-row.nu-hide-score {
        grid-template-columns: 44px minmax(0, 1fr) auto auto;
      }
      .nu-task-wrap:hover .nu-task-row { background: var(--task-hover); }

      .nu-rank {
        text-align: center;
        color: var(--dim);
        font-weight: 700;
        font-family: "IBM Plex Mono", monospace;
        font-size: 1.3rem;
      }
      .nu-rank-top { color: var(--amber); }

      .nu-main { min-width: 0; }
      .nu-name-btn {
        display: flex;
        align-items: baseline;
        gap: 0.4rem;
        background: none;
        border: 0;
        padding: 0;
        color: inherit;
        text-align: left;
        width: 100%;
      }
      .nu-caret { color: var(--dim); font-size: 0.7rem; }
      .nu-task-name {
        color: var(--text);
        font-size: 0.95rem;
        font-weight: 600;
        overflow-wrap: anywhere;
      }

      .nu-meta-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.55rem;
        margin-top: 0.2rem;
      }

      .nu-due {
        color: var(--muted);
        font-size: 0.72rem;
        font-family: "IBM Plex Mono", monospace;
      }
      .nu-due-urgent { color: var(--amber); }
      .nu-due-overdue { color: var(--danger); }
      .nu-subtask-count {
        color: var(--dim);
        font-size: 0.68rem;
        font-family: "IBM Plex Mono", monospace;
      }

      .nu-tag {
        display: inline-block;
        padding: 0.1rem 0.45rem;
        border: 1px solid;
        border-radius: 10px;
        font-size: 0.65rem;
        font-weight: 600;
      }

      .nu-bars {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }
      .nu-bars-row {
        display: flex;
        align-items: center;
        gap: 0.35rem;
      }
      .nu-bars-cap {
        width: 22px;
        color: var(--dim);
        font-size: 0.55rem;
      }
      .nu-segs { display: flex; gap: 2px; }
      .nu-seg {
        width: 8px;
        height: 8px;
        border-radius: 1px;
        background: #526152;
      }
      .nu-seg-on.nu-seg-amber { background: var(--amber); }
      .nu-seg-on.nu-seg-green { background: var(--green); }

      .nu-score { text-align: center; }
      .nu-score-num {
        color: var(--text);
        font-weight: 700;
        font-size: 1.15rem;
        font-family: "IBM Plex Mono", monospace;
      }
      .nu-score-label { color: var(--dim); font-size: 0.55rem; }

      .nu-actions {
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }
      .nu-checkbox { width: 18px; height: 18px; accent-color: var(--success); }
      .nu-icon-btn {
        padding: 0.3rem 0.5rem;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--muted);
        font-size: 0.68rem;
        font-weight: 600;
        text-transform: uppercase;
      }
      .nu-icon-btn-danger {
        border-color: var(--danger);
        color: var(--danger);
      }

      .nu-empty {
        padding: 2.5rem 1rem;
        text-align: center;
        color: var(--muted);
      }
      .nu-empty-title {
        color: var(--text);
        font-size: 1.3rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      @media (max-width: 680px) {
        .nu-app { padding: 1rem; }
        .nu-header { align-items: flex-start; }
        .nu-stats { width: 100%; justify-content: space-between; }
        .nu-task-row {
          grid-template-columns: 32px minmax(0, 1fr) auto;
          grid-template-areas:
            "rank main score"
            "rank bars score"
            "rank actions actions";
          row-gap: 0.5rem;
        }
        .nu-task-row.nu-hide-score {
          grid-template-columns: 32px minmax(0, 1fr);
          grid-template-areas:
            "rank main"
            "rank bars"
            "rank actions";
        }
        .nu-rank { grid-area: rank; }
        .nu-main { grid-area: main; }
        .nu-bars { grid-area: bars; flex-direction: row; gap: 0.9rem; }
        .nu-score { grid-area: score; display: block; align-self: center; }
        .nu-actions { grid-area: actions; }
        .nu-sort-toggle { flex-wrap: wrap; overflow: visible; }
        .nu-sort-btn { flex: 1 1 auto; }
        .nu-field-row > .nu-btn { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script>
      const STORAGE_KEY = 'nextup-tasks';
      const SETTINGS_KEY = 'nextup-settings';
      const EFFORT_LEVELS = [
        { value: 1, label: 'Quick', hint: '~15 min' },
        { value: 2, label: 'Light', hint: '30 min–1 hr' },
        { value: 3, label: 'Medium', hint: '1–2 hrs' },
        { value: 4, label: 'Heavy', hint: '2–3 hrs' },
        { value: 5, label: 'Huge', hint: '3+ hrs' }
      ];

      function seedTasks() {
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        const add = (name, offset, effort, subject = 'General') => {
          const due = new Date(today);
          due.setDate(due.getDate() + offset);
          return {
            id: crypto.randomUUID(),
            name,
            subject,
            dueDate: due.toISOString().slice(0, 10),
            effort,
            completed: false,
            household: subject === 'Household',
            score: 0,
            subtasks: [],
            createdAt: Date.now()
          };
        };

        return [
          add('Wash dishes', 0, 1, 'Household'),
          add('Pay electric bill', 1, 2, 'Life'),
          add('Take out trash', 1, 1, 'Household'),
          add('Call dentist', 2, 2, 'Life'),
          add('Clean bathroom', 2, 4, 'Household'),
          add('Book flights', 3, 3, 'Travel'),
          add('Finish proposal draft', 4, 5, 'Work'),
          add('Vacuum living areas', 5, 3, 'Household')
        ];
      }

      const defaultState = {
        tasks: seedTasks(),
        sort: 'due',
        groupBySubject: true,
        showScores: true,
        householdMode: true
      };

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const settings = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
          if (!raw) return { ...defaultState, ...settings };
          const parsed = JSON.parse(raw);
          return { ...defaultState, ...parsed, ...settings };
        } catch {
          return { ...defaultState };
        }
      }

      function saveState(state) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          tasks: state.tasks,
          sort: state.sort,
          groupBySubject: state.groupBySubject,
          householdMode: state.householdMode,
          showScores: state.showScores
        }));
        localStorage.setItem(SETTINGS_KEY, JSON.stringify({
          showScores: state.showScores,
          householdMode: state.householdMode,
          groupBySubject: state.groupBySubject,
          sort: state.sort
        }));
      }

      function effortMeta(value) {
        return EFFORT_LEVELS.find(item => item.value === Number(value)) || EFFORT_LEVELS[0];
      }

      function taskScore(task) {
        const due = new Date(task.dueDate + 'T00:00:00');
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const dayDiff = Math.ceil((due - today) / 86400000);
        const urgencyBoost = Math.max(0, 5 - dayDiff);
        const effort = Number(task.effort || 1);
        const subjectBoost = task.subject === 'Household' ? 1 : 0;
        return Math.max(1, Math.min(99, (effort * 9) + urgencyBoost + subjectBoost + (task.completed ? -20 : 0)));
      }

      function getVisibleTasks(tasks, state) {
        const visible = tasks.filter(task => !task.completed);
        return visible.sort((a, b) => {
          if (state.sort === 'score') return taskScore(b) - taskScore(a);
          if (state.sort === 'effort') return (Number(b.effort) || 0) - (Number(a.effort) || 0);
          return new Date(a.dueDate) - new Date(b.dueDate);
        });
      }

      function renderTaskRow(task, index) {
        const score = taskScore(task);
        const dueDate = new Date(task.dueDate + 'T00:00:00');
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const diffDays = Math.round((dueDate - today) / 86400000);
        const dueClass = diffDays <= 1 ? 'nu-due-urgent' : diffDays < 0 ? 'nu-due-overdue' : '';
        const dueText = diffDays < 0 ? `${Math.abs(diffDays)}d overdue` : diffDays === 0 ? 'due today' : `due in ${diffDays}d`;

        const rowClasses = ['nu-task-row'];
        if (!state.showScores) rowClasses.push('nu-hide-score');

        return `
          <div class="nu-task-wrap">
            <div class="${rowClasses.join(' ')}">
              <div class="nu-rank ${index === 0 ? 'nu-rank-top' : ''}">${index + 1}</div>

              <div class="nu-main">
                <button class="nu-name-btn" type="button" data-action="toggle-details" data-id="${task.id}">
                  <span class="nu-caret">▸</span>
                  <span class="nu-task-name">${escapeHtml(task.name)}</span>
                </button>
                <div class="nu-meta-row">
                  <span class="nu-due ${dueClass}">${dueText}</span>
                  <span class="nu-subtask-count">${task.subtasks.length} subtasks</span>
                  <span class="nu-tag" style="border-color:${subjectColor(task.subject)}; color:${subjectColor(task.subject)};">${escapeHtml(task.subject)}</span>
                </div>
              </div>

              <div class="nu-bars">
                <div class="nu-bars-row">
                  <span class="nu-bars-cap">eff</span>
                  <div class="nu-segs">
                    ${renderEffortSegments(task.effort)}
                  </div>
                </div>
              </div>

              ${state.showScores ? `
                <div class="nu-score">
                  <div class="nu-score-num">${score}</div>
                  <div class="nu-score-label">score</div>
                </div>
              ` : ''}

              <div class="nu-actions">
                <input class="nu-checkbox" type="checkbox" data-action="complete-task" data-id="${task.id}" ${task.completed ? 'checked' : ''} />
                <button class="nu-icon-btn" type="button" data-action="edit-task" data-id="${task.id}">edit</button>
                <button class="nu-icon-btn nu-icon-btn-danger" type="button" data-action="delete-task" data-id="${task.id}">delete</button>
              </div>
            </div>
          </div>
        `;
      }

      function renderEffortSegments(value) {
        const effort = Number(value) || 1;
        let markup = '';
        for (let i = 1; i <= 5; i++) {
          const on = i <= effort;
          const tone = i <= 3 ? 'amber' : 'green';
          markup += `<span class="nu-seg ${on ? 'nu-seg-on ' + tone : ''}"></span>`;
        }
        return markup;
      }

      function subjectColor(subject) {
        const map = {
          Household: '#91c69a',
          Work: '#a8d5aa',
          Life: '#ceda8b',
          Travel: '#8bd2b9'
        };
        return map[subject] || '#d2a5d0';
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function renderStats(tasks) {
        const open = tasks.filter(t => !t.completed).length;
        const urgent = tasks.filter(t => !t.completed && new Date(t.dueDate + 'T00:00:00') <= new Date(Date.now() + 86400000 * 2)).length;
        return `
          <div class="nu-header">
            <div>
              <h1 class="nu-title">Next<span>Up</span></h1>
              <p class="nu-subtitle">Weekly task board</p>
            </div>
            <div class="nu-stats">
              <div class="nu-stat">
                <div class="nu-stat-num">${open}</div>
                <div class="nu-stat-label">open</div>
              </div>
              <div class="nu-stat ${urgent ? 'nu-stat-danger' : ''}">
                <div class="nu-stat-num">${urgent}</div>
                <div class="nu-stat-label">soon</div>
              </div>
            </div>
          </div>
        `;
      }

      function renderForm() {
        return `
          <div class="nu-panel">
            <div class="nu-field-row">
              <div class="nu-field nu-field-name">
                <label class="nu-label" for="task-name">Task</label>
                <input id="task-name" class="nu-input" type="text" placeholder="Add a task" />
              </div>
              <div class="nu-field">
                <label class="nu-label" for="task-subject">Subject</label>
                <select id="task-subject" class="nu-input nu-input-sm">
                  <option>Household</option>
                  <option>Work</option>
                  <option>Life</option>
                  <option>Travel</option>
                </select>
              </div>
              <div class="nu-field">
                <label class="nu-label" for="task-date">Due</label>
                <input id="task-date" class="nu-input nu-input-sm" type="date" />
              </div>
              <div class="nu-field">
                <label class="nu-label" for="task-effort">Effort</label>
                <select id="task-effort" class="nu-input nu-input-sm">
                  ${EFFORT_LEVELS.map(item => `<option value="${item.value}">${item.label}</option>`).join('')}
                </select>
              </div>
              <button class="nu-btn nu-btn-primary" type="button" id="add-task-btn">Add</button>
            </div>
          </div>
        `;
      }

      function renderControls() {
        return `
          <div class="nu-panel">
            <div class="nu-sort-row">
              <label class="nu-sort-label">Sort</label>
              <div class="nu-sort-toggle">
                <button class="nu-sort-btn ${state.sort === 'due' ? 'active' : ''}" type="button" data-sort="due">Due</button>
                <button class="nu-sort-btn ${state.sort === 'score' ? 'active' : ''}" type="button" data-sort="score">Score</button>
                <button class="nu-sort-btn ${state.sort === 'effort' ? 'active' : ''}" type="button" data-sort="effort">Effort</button>
              </div>
              <button class="nu-group-toggle ${state.groupBySubject ? 'active' : ''}" type="button" data-action="toggle-grouping">${state.groupBySubject ? 'Grouped' : 'Flat'}</button>
              <button class="nu-group-toggle ${state.showScores ? 'active' : ''}" type="button" data-action="toggle-scores">${state.showScores ? 'Scores on' : 'Scores off'}</button>
            </div>
          </div>
        `;
      }

      function renderGroupList(tasks) {
        const visible = getVisibleTasks(tasks, state);
        const groups = {};
        visible.forEach(task => {
          groups[task.subject] = groups[task.subject] || [];
          groups[task.subject].push(task);
        });

        const keys = Object.keys(groups);
        if (!keys.length) {
          return `<div class="nu-empty"><div class="nu-empty-title">No tasks left</div></div>`;
        }

        return keys.map(subject => {
          const groupTasks = groups[subject];
          return `
            <div>
              <div class="nu-group-header">
                <span class="nu-group-dot" style="background:${subjectColor(subject)}"></span>
                <span class="nu-group-name">${escapeHtml(subject)}</span>
                <span class="nu-group-count">${groupTasks.length}</span>
              </div>
              <div class="nu-list">
                ${groupTasks.map((task, index) => renderTaskRow(task, index)).join('')}
              </div>
            </div>
          `;
        }).join('');
      }

      function renderFlatList(tasks) {
        const visible = getVisibleTasks(tasks, state);
        if (!visible.length) {
          return `<div class="nu-empty"><div class="nu-empty-title">No tasks left</div></div>`;
        }
        return `
          <div class="nu-list">
            ${visible.map((task, index) => renderTaskRow(task, index)).join('')}
          </div>
        `;
      }

      function renderApp() {
        const tasks = state.tasks;
        const listContent = state.groupBySubject ? renderGroupList(tasks) : renderFlatList(tasks);

        app.innerHTML = `
          <div class="nu-app">
            ${renderStats(tasks)}
            ${renderForm()}
            ${renderControls()}
            ${listContent}
          </div>
        `;

        bindEvents();
      }

      function bindEvents() {
        document.getElementById('add-task-btn')?.addEventListener('click', () => {
          const nameInput = document.getElementById('task-name');
          const dateInput = document.getElementById('task-date');
          const subjectInput = document.getElementById('task-subject');
          const effortInput = document.getElementById('task-effort');
          const name = nameInput.value.trim();
          if (!name) return;

          const task = {
            id: crypto.randomUUID(),
            name,
            subject: subjectInput.value,
            dueDate: dateInput.value || new Date(Date.now() + 86400000).toISOString().slice(0, 10),
            effort: Number(effortInput.value) || 1,
            completed: false,
            household: subjectInput.value === 'Household',
            score: 0,
            subtasks: [],
            createdAt: Date.now()
          };

          state.tasks.unshift(task);
          saveState(state);
          renderApp();
          nameInput.value = '';
          dateInput.value = '';
        });

        document.querySelectorAll('[data-sort]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.sort = btn.dataset.sort;
            saveState(state);
            renderApp();
          });
        });

        document.querySelectorAll('[data-action="toggle-grouping"]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.groupBySubject = !state.groupBySubject;
            saveState(state);
            renderApp();
          });
        });

        document.querySelectorAll('[data-action="toggle-scores"]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.showScores = !state.showScores;
            saveState(state);
            renderApp();
          });
        });

        document.querySelectorAll('[data-action="complete-task"]').forEach(input => {
          input.addEventListener('change', () => {
            const task = state.tasks.find(t => t.id === input.dataset.id);
            if (!task) return;
            task.completed = input.checked;
            saveState(state);
            renderApp();
          });
        });

        document.querySelectorAll('[data-action="delete-task"]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.tasks = state.tasks.filter(t => t.id !== btn.dataset.id);
            saveState(state);
            renderApp();
          });
        });
      }

      const app = document.getElementById('app');
      let state = loadState();
      renderApp();
    </script>
  </body>
</html>
